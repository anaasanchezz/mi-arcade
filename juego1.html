<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego</title>
</head>

<body>

<h1>Click Game 🎯</h1>

<button onclick="sumar()">CLICK</button>

<h2 id="puntos">0</h2>

<script>
let puntos = 0;

function sumar(){
    puntos++;
    document.getElementById("puntos").innerText = puntos;
}
</script>

</body>
</html>
